{% extends 'base.html' %}

{% block title %}Ruxsat yo'q{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/60 rounded-2xl shadow-lg p-10 text-center transition-colors duration-300">

    <div class="text-6xl mb-4">🔒</div>

    <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">
        Bu darsni ko'rish uchun kursga yozilgan bo'lishingiz kerak
    </h1>

    <p class="text-slate-500 dark:text-slate-400 mt-3 leading-relaxed">
        "<strong>{{ course.title }}</strong>" kursidagi darslarni ko'rish uchun,
        avval shu kursga yoziling.
    </p>

    <a href="{% url 'courses:course_detail' course.slug %}"
       class="inline-block mt-8 bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl text-lg font-semibold transition shadow-md">
        Kurs sahifasiga o'tish
    </a>

</div>

{% endblock %}
