{% extends 'base.html' %}

{% block title %}Ruxsat yo'q{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-10 text-center">

    <div class="text-6xl mb-4">🔒</div>

    <h1 class="text-2xl font-bold text-slate-800">
        Bu darsni ko'rish uchun kursga yozilgan bo'lishingiz kerak
    </h1>

    <p class="text-slate-500 mt-3">
        "<strong>{{ course.title }}</strong>" kursidagi darslarni ko'rish uchun,
        avval shu kursga yoziling.
    </p>

    <a href="{% url 'courses:course_detail' course.slug %}"
       class="inline-block mt-8 bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl text-lg font-semibold transition">
        Kurs sahifasiga o'tish
    </a>

</div>

{% endblock %}
